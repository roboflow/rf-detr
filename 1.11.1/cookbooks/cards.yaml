cards:
  - href: train-coco2017/
    name: "Train RF-DETR Nano on COCO2017"
    labels: [TRAINING, COCO2017, PYTORCH LIGHTNING]
    version: v1.10.0
    author: Borda
    description: "Download the full public COCO2017 dataset and train RF-DETR Nano from scratch for 40 epochs end to end on a single CUDA GPU with torch.compile and automatic mixed precision (bf16 when supported, otherwise fp16), with optional FP8 via Transformer Engine."
  - href: export-cuda/
    name: "RF-DETR on NVIDIA GPUs — Export, Inference & Latency"
    labels: [EXPORT, INFERENCE, DEPLOY, CUDA]
    version: v1.11.0
    author: Borda
    description: "Export RF-DETR to ONNX (CUDA execution provider) and TensorRT, run inference on both, and benchmark them against the PyTorch fp32/fp16+JIT baseline on an NVIDIA GPU."
  - href: export-cpu/
    name: "RF-DETR on CPU — Export, Inference & Latency"
    labels: [EXPORT, INFERENCE, DEPLOY, CPU]
    version: v1.11.0
    author: Borda
    description: "Export RF-DETR to ONNX (CPU execution provider) and OpenVINO IR, run inference on both, and benchmark them against the PyTorch baseline on a general-purpose CPU."
  - href: export-mobile/
    name: "RF-DETR on Mobile & Edge — Export, Inference & Latency"
    labels: [EXPORT, INFERENCE, DEPLOY, TFLITE, MOBILE]
    version: v1.11.0
    author: Borda
    description: "Export RF-DETR to TFLite (INT8), LiteRT, and ExecuTorch's XNNPACK backend, run inference on each, and benchmark them for on-device mobile and edge deployment."
  - href: export-apple/
    name: "RF-DETR on Apple Silicon — Export, Inference & Latency"
    labels: [EXPORT, INFERENCE, DEPLOY, APPLE]
    version: v1.11.0
    author: Borda
    description: "Export RF-DETR to native CoreML, Core AI, and ExecuTorch's CoreML backend, run inference on each, and benchmark them against the PyTorch (MPS) baseline on Apple Silicon."
  - href: fine-tune_detection/
    name: "Fine-Tune RF-DETR Object Detection"
    labels: [TRAINING, PYTORCH LIGHTNING, INFERENCE]
    version: v1.8.2
    author: Borda
    description: "Fine-tune RF-DETR object detection on any COCO detection dataset from Roboflow Universe — covers PPE safety, traffic, sports, infrastructure, and marine-wildlife use cases."
  - href: fine-tune_segmentation/
    name: "Fine-Tune RF-DETR Instance Segmentation"
    labels: [TRAINING, PYTORCH LIGHTNING, SEGMENTATION, INFERENCE]
    version: v1.8.1
    author: Borda
    description: "Fine-tune RF-DETR instance segmentation on any COCO segmentation dataset from Roboflow Universe — covers training, mask loss metrics, and inference with mask overlays."
  - href: fine-tune_keypoints/
    name: "Fine-Tune RF-DETR Keypoint Detection"
    labels: [TRAINING, PYTORCH LIGHTNING, INFERENCE]
    version: v1.8.0
    author: Borda
    description: "Fine-tune RF-DETR keypoint detection on any COCO keypoint dataset from Roboflow Universe — covers training, metrics, and inference with uncertainty ellipses."
  - href: custom-augmentations/
    name: "Custom Augmentations and Live Training Progress"
    labels: [TRAINING, AUGMENTATION]
    version: v1.5.0
    author: Borda
    description: "Add optional custom Albumentations augmentations and monitor training metrics in real time."
  - href: pytorch-lightning/
    name: "Training with PyTorch Lightning"
    labels: [TRAINING, PYTORCH LIGHTNING]
    version: v1.6.0
    author: Borda
    description: "Train RF-DETR with PyTorch Lightning — callbacks, checkpointing, and the LightningModule API."
  - href: custom-optimizer-scheduler/
    name: "Custom Optimizer and LR Scheduler"
    labels: [TRAINING, PYTORCH LIGHTNING]
    version: v1.9.0
    author: Borda
    description: "Swap RF-DETR's optimizer and LR scheduler via TrainConfig — native torch.optim, a third-party optimizer by import path, or a functools.partial — fine-tuned on a small Roboflow Universe dataset."
