<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1797" height="1190" viewBox="0 0 1797 1190"
     role="img" aria-labelledby="title description">
  <title id="title">RF100-VL Score: Test Accuracy-Latency Pareto</title>
  <desc id="description">A comparison of Platform NAS, Paper NAS, and named RF-DETR paper configurations, averaged over 100 datasets.</desc>

  <defs>
    <clipPath id="plot-area">
      <rect x="180" y="118" width="1242" height="926"/>
    </clipPath>
    <style>
      .chart-text { font-family: "DejaVu Sans", Arial, sans-serif; }
      .tick { fill: #898781; font-size: 29px; }
      .axis-label { fill: #52514e; font-size: 31px; }
      .legend-label { fill: #52514e; font-size: 28px; }
      .config-label { fill: #898781; font-size: 25px; }
      .grid { stroke: #e1e0d9; stroke-width: 2; }
      .axis { stroke: #c3c2b7; stroke-width: 2; }
      .platform { fill: none; stroke: #2a78d6; stroke-width: 5.25; stroke-linecap: round; stroke-linejoin: round; }
      .paper { fill: none; stroke: #1baf7a; stroke-width: 5.25; stroke-linecap: round; stroke-linejoin: round; }
      .named { fill: none; stroke: #898781; stroke-width: 4.25; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 15.5 7; }
    </style>
  </defs>

  <rect width="1797" height="1190" fill="#fcfcfb"/>

  <text class="chart-text" x="180" y="80" fill="#0b0b0b" font-size="40" font-weight="700">
    RF100-VL Score: Test Accuracy-Latency Pareto (Avg over 100 Datasets)
  </text>

  <g aria-hidden="true">
    <path class="grid" d="M200.5 118V1043 M445.5 118V1043 M690.5 118V1043 M935.5 118V1043 M1180.5 118V1043"/>
    <path class="grid" d="M180 210H1422 M180 355H1422 M180 500H1422 M180 645H1422 M180 790H1422 M180 935H1422"/>
    <path class="axis" d="M180.5 118V1043.5H1422"/>
    <path stroke="#898781" stroke-width="2" d="M200.5 1043V1051 M445.5 1043V1051 M690.5 1043V1051 M935.5 1043V1051 M1180.5 1043V1051 M172 210H180 M172 355H180 M172 500H180 M172 645H180 M172 790H180 M172 935H180"/>
  </g>

  <g class="chart-text tick" aria-hidden="true">
    <text x="200.5" y="1083" text-anchor="middle">2</text>
    <text x="445.5" y="1083" text-anchor="middle">4</text>
    <text x="690.5" y="1083" text-anchor="middle">6</text>
    <text x="935.5" y="1083" text-anchor="middle">8</text>
    <text x="1180.5" y="1083" text-anchor="middle">10</text>
    <text x="162" y="220" text-anchor="end">0.63</text>
    <text x="162" y="365" text-anchor="end">0.62</text>
    <text x="162" y="510" text-anchor="end">0.61</text>
    <text x="162" y="655" text-anchor="end">0.60</text>
    <text x="162" y="800" text-anchor="end">0.59</text>
    <text x="162" y="945" text-anchor="end">0.58</text>
  </g>

  <g class="chart-text axis-label">
    <text x="801" y="1134" text-anchor="middle">Latency (ms)</text>
    <text x="71" y="581" text-anchor="middle" transform="rotate(-90 71 581)">Average test mAP@50:95</text>
  </g>

  <g clip-path="url(#plot-area)">
    <polyline class="named" points="238,979 384,616 495,471 789,326 1365,224"/>
    <polyline class="platform" points="260,902 405,498 516,370 750,291 1180,182"/>
    <g fill="#2a78d6" stroke="#fcfcfb" stroke-width="4">
      <circle cx="260" cy="902" r="11"/>
      <circle cx="405" cy="498" r="11"/>
      <circle cx="516" cy="370" r="11"/>
      <circle cx="750" cy="291" r="11"/>
      <circle cx="1180" cy="182" r="11"/>
    </g>
    <polyline class="paper" points="260,902 405,498 516,359 726,327 1153,246"/>
    <g fill="#1baf7a" stroke="#fcfcfb" stroke-width="4">
      <path d="M260 887L275 902L260 917L245 902Z"/>
      <path d="M405 483L420 498L405 513L390 498Z"/>
      <path d="M516 344L531 359L516 374L501 359Z"/>
      <path d="M726 312L741 327L726 342L711 327Z"/>
      <path d="M1153 231L1168 246L1153 261L1138 246Z"/>
    </g>
    <g fill="#898781" stroke="#fcfcfb" stroke-width="4">
      <rect x="231" y="972" width="14" height="14"/>
      <rect x="377" y="609" width="14" height="14"/>
      <rect x="488" y="464" width="14" height="14"/>
      <rect x="782" y="319" width="14" height="14"/>
      <rect x="1358" y="217" width="14" height="14"/>
    </g>
  </g>

  <g class="chart-text config-label">
    <text x="238" y="1018" text-anchor="middle">N</text>
    <text x="384" y="654" text-anchor="middle">S</text>
    <text x="495" y="509" text-anchor="middle">M</text>
    <text x="789" y="365" text-anchor="middle">L</text>
    <text x="1365" y="263" text-anchor="middle">XL</text>
  </g>

  <g class="chart-text legend-label">
    <g>
      <path class="platform" d="M910 925H970"/>
      <circle cx="940" cy="925" r="11" fill="#2a78d6" stroke="#fcfcfb" stroke-width="4"/>
      <text x="990" y="935">Platform NAS</text>
    </g>
    <g>
      <path class="paper" d="M910 965H970"/>
      <path d="M940 950L955 965L940 980L925 965Z" fill="#1baf7a" stroke="#fcfcfb" stroke-width="4"/>
      <text x="990" y="975">Paper NAS</text>
    </g>
    <g>
      <path class="named" d="M910 1004H970"/>
      <rect x="933" y="997" width="14" height="14" fill="#898781" stroke="#fcfcfb" stroke-width="4"/>
      <text x="990" y="1014">RF-DETR Paper Named Configs</text>
    </g>
  </g>
</svg>
