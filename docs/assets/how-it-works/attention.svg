    text { font-family: "CMU Serif", "Latin Modern Roman", Georgia, "Times New Roman", serif; fill: #ECECEC; }
    .h { font-size: 24px; }
    .s { font-size: 15px; fill: #B8B8B8; }
    .lbl { font-size: 15px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .cell { fill: #22252C; stroke: #3A3F49; stroke-width: 1; }
    .hot { fill: #1C758A; fill-opacity: .7; stroke: #3A3F49; stroke-width: 1; }
    .q { fill: #F4D345; stroke: #16181D; stroke-width: 1.5; }
    .ray { stroke: #58C4DD; stroke-width: 1; opacity: .55; }
    .rays { animation: breathe 4s ease-in-out infinite; }
    .wline { stroke: #F0AC5F; stroke-width: 3; }
    @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
