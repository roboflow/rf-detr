  <text class="lbl" x="40" y="390">RF-DETR Small: 16 heads × 2 points = 32 samples per query on one stride-16 map.</text>
  <text class="s" x="40" y="416">Each decoder layer predicts a small correction to the box it received; the last layer’s box is the output.</text>
