<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Dense cross-attention versus deformable attention</title>
  <desc id="desc">Left: in the original DETR every query attends to every location of the feature map. Right: in deformable attention a query looks at a handful of learned sampling points around its current box, and each decoder layer tightens the box around the object.</desc>
  <style>
    text { font-family: "CMU Serif", "Latin Modern Roman", Georgia, "Times New Roman", serif; fill: #ECECEC; }
    .h { font-size: 24px; }
    .s { font-size: 15px; fill: #B8B8B8; }
    .lbl { font-size: 15px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .cell { fill: #22252C; stroke: #3A3F49; stroke-width: 1; }
    .obj { fill: #1C758A; fill-opacity: .55; stroke: #58C4DD; stroke-width: 2; }
    .ray { stroke: #9A72AC; stroke-width: 1; opacity: .45; }
    .q { fill: #F4D345; stroke: #16181D; stroke-width: 1.5; }
    .off { stroke-width: 2; fill: none; stroke-dasharray: 80; stroke-dashoffset: 0; animation: reach 8s infinite; }
    .pt { stroke: #16181D; stroke-width: 1.2; }
    .b0 { fill: none; stroke: #888888; stroke-width: 2; stroke-dasharray: 6 4; }
    .b1, .b2, .b3 { fill: none; stroke-width: 2.5; }
    .b1 { stroke: #F0AC5F; opacity: .45; animation: s1 8s infinite; }
    .b2 { stroke: #F4D345; opacity: .6; animation: s2 8s infinite; }
    .b3 { stroke: #83C167; opacity: 1; animation: s3 8s infinite; }
    @keyframes reach { 0%, 5% { stroke-dashoffset: 80; } 25%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 80; } }
    @keyframes s1 { 0%, 30% { opacity: 0; } 38%, 50% { opacity: 1; } 58%, 92% { opacity: .45; } 100% { opacity: 0; } }
    @keyframes s2 { 0%, 50% { opacity: 0; } 58%, 68% { opacity: 1; } 76%, 92% { opacity: .6; } 100% { opacity: 0; } }
    @keyframes s3 { 0%, 68% { opacity: 0; } 76%, 92% { opacity: 1; } 100% { opacity: 0; } }
  </style>
