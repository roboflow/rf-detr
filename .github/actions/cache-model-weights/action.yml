name: Shared model weights cache
description: Restore compatible cross-OS model weights; the post-smoke develop publisher saves fresh archives.
inputs:
  save:
    description: Save fresh smoke-tested weights in the dedicated develop-push publisher only.
    default: "false"
runs:
  using: composite
  steps:
    - name: Configure model cache directories and key
      shell: bash
      id: key
      env:
        MODEL_CACHE_SAVE: ${{ inputs.save }}
      run: |
        echo "RF_HOME=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "HF_HOME=$GITHUB_WORKSPACE/.huggingface" >> "$GITHUB_ENV"
        echo "HF_HUB_CACHE=$GITHUB_WORKSPACE/.huggingface/hub" >> "$GITHUB_ENV"
        python .github/scripts/model_cache_key.py

    - name: Download the test backbone for the fresh master archive
      if: inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.job == 'cache-model-weights'
      shell: python
      run: |
        from huggingface_hub import snapshot_download

        snapshot_download("facebook/dinov2-with-registers-base", ignore_patterns=["*.msgpack", "flax_model*", "tf_model*", "rust_model*"])

    - name: Save fresh master archive after all smoke jobs passed
      if: inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.job == 'cache-model-weights'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          rf-detr-*.pth
          rf-detr-*.pt
          .huggingface/hub
        key: ${{ steps.key.outputs.key }}
        enableCrossOsArchive: true

    - name: Restore latest compatible master archive without saving
      if: ${{ !(inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.job == 'cache-model-weights') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          rf-detr-*.pth
          rf-detr-*.pt
          .huggingface/hub
        key: ${{ steps.key.outputs.key }}
        enableCrossOsArchive: true
