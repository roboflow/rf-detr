name: Shared model weights cache
description: Restore compatible cross-OS model weights; the post-smoke develop publisher saves fresh archives.
inputs:
  save:
    description: Verify and save a fresh archive in the dedicated develop-push publisher only.
    default: "false"
runs:
  using: composite
  steps:
    - name: Compute compatible cache key and configure model directories
      shell: bash
      id: key
      env:
        MODEL_CACHE_SAVE: ${{ inputs.save }}
      run: python .github/scripts/model_weight_cache.py configure

    - name: Verify the complete smoke handoff and populate the test backbone
      if: inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.job == 'cache-model-weights'
      shell: bash
      run: python .github/scripts/model_weight_cache.py verify

    - name: Save fresh master archive after all smoke jobs passed
      if: inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.job == 'cache-model-weights'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          rf-detr-*.pth
          rf-detr-*.pt
          .huggingface/hub
        key: ${{ steps.key.outputs.key }}
        enableCrossOsArchive: true

    - name: Restore latest compatible master archive without saving
      if: ${{ !(inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.job == 'cache-model-weights') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          rf-detr-*.pth
          rf-detr-*.pt
          .huggingface/hub
        key: ${{ steps.key.outputs.key }}
        enableCrossOsArchive: true
