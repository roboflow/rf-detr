name: Update Weekly Metrics SVG

# Keeps the automation/update-weekly-metrics branch current and makes sure a pull request from it into the
# default branch is open whenever the branch carries an unpublished SVG, so the chart never goes stale
# because nobody noticed the branch.
#
# Opening the pull request needs a token that may create one. The repository does not let GITHUB_TOKEN do
# that (Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests"), so store a
# token with pull-request write access as the METRICS_PR_TOKEN secret. A pull request opened with that token
# also triggers the required checks; one opened with GITHUB_TOKEN does not. Without either, the final step
# fails the run with the compare link, so the gap is visible instead of silent.
#
# The default branch is squash-merged, so a merged weekly pull request leaves its commits on the branch while
# the default branch holds one unrelated squash commit that edits the same SVG. The sync step merges the
# default branch back into the automation branch, keeping the branch's SVG, so the next pull request never
# conflicts.

on:
  schedule:
    # PyPI Stats starts its daily update around 01:00 UTC but publishes no completion SLA.
    # Monday 06:17 UTC leaves a buffer for Sunday data after the prior Mon–Sun week closes; the
    # off-hour minute avoids the top-of-hour peak, when GitHub delays or drops scheduled runs.
    # Tuesday through Thursday are retries: every run of the same calendar week resolves to the
    # same completed Mon–Sun period, and re-recording that period refreshes only its download
    # total, so a Monday lost to missing upstream data is recovered instead of skipped forever.
    - cron: "17 6 * * 1-4"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-metrics-svg
  cancel-in-progress: false

jobs:
  update-metrics:
    name: Update weekly metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 🐍 Install uv and set Python
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          version: "0.9.26"
          python-version: "3.10"
          activate-environment: true

      - name: 📚 Restore unmerged metrics history
        env:
          METRICS_BRANCH: automation/update-weekly-metrics
        run: |
          set -euo pipefail
          # Continue from the automation branch's own history whenever it exists, regardless of
          # whether it currently has an open pull request — a pull request can go stale or be closed
          # without the branch being deleted, and gating restoration on PR state would silently
          # discard every checkpoint already accumulated there.
          # An exact-ref lookup tells "branch absent" (exit 2) apart from a failed lookup, so a network
          # or auth error fails the run instead of silently restarting from the default branch's SVG.
          ls_remote_status=0
          git ls-remote --exit-code --heads origin "refs/heads/$METRICS_BRANCH" || ls_remote_status=$?
          if [ "$ls_remote_status" -eq 0 ]; then
            git fetch --no-tags --depth=1 origin "$METRICS_BRANCH" || {
              echo "::error::git fetch failed for $METRICS_BRANCH"
              exit 1
            }
            # The commit step builds its commit on the tip restored here.
            echo "METRICS_BASE_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            # The shell truncates a redirect target before the command on its left runs, so writing
            # straight onto the tracked path would leave an empty SVG behind whenever git show fails.
            git show FETCH_HEAD:docs/assets/weekly-metrics.svg > docs/assets/weekly-metrics.svg.tmp || {
              echo "::error::git show failed to restore weekly-metrics.svg from $METRICS_BRANCH"
              exit 1
            }
            mv docs/assets/weekly-metrics.svg.tmp docs/assets/weekly-metrics.svg
            # Stage the restored blob so the commit step's no-op guard compares the generator's output
            # with the branch's SVG, not the default branch's; otherwise every retry re-pushes it.
            git add -- docs/assets/weekly-metrics.svg
          elif [ "$ls_remote_status" -ne 2 ]; then
            echo "::error::git ls-remote failed for $METRICS_BRANCH"
            exit "$ls_remote_status"
          fi

      - name: 📊 Generate weekly metrics SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_weekly_metrics.py

      - name: 📤 Commit and push metrics update
        env:
          METRICS_BRANCH: automation/update-weekly-metrics
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/assets/weekly-metrics.svg; then
            echo "No changes to commit."
            exit 0
          fi
          # Build the update on the tip the restore step read the SVG from (METRICS_BASE_SHA, via GITHUB_ENV)
          # so the push below is a plain fast-forward and never needs a force. Unset means the branch was
          # absent at restore, and the commit then starts the branch from the default branch checkout.
          if [ -n "${METRICS_BASE_SHA:-}" ]; then
            generated_svg="$(mktemp)"
            cp -- docs/assets/weekly-metrics.svg "$generated_svg"
            git switch --detach --force "$METRICS_BASE_SHA"
            cp -- "$generated_svg" docs/assets/weekly-metrics.svg
          fi
          git add -- docs/assets/weekly-metrics.svg
          git commit -m "docs: update weekly project metrics"
          # No force: a branch that moved since the restore, or one created meanwhile, makes git reject this
          # push as non-fast-forward and fail the run instead of dropping a checkpoint.
          git push origin HEAD:"$METRICS_BRANCH"
          # The later steps sync the branch and open the pull request; the link covers a run that stops before them.
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${METRICS_BRANCH}?expand=1"
          echo "::notice title=Weekly metrics pushed::Pull request: $compare_url"
          echo "Weekly metrics pushed to \`$METRICS_BRANCH\`. Pull request: $compare_url" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔀 Sync metrics branch with the default branch
        env:
          METRICS_BRANCH: automation/update-weekly-metrics
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls_remote_status=0
          git ls-remote --exit-code --heads origin "refs/heads/$METRICS_BRANCH" || ls_remote_status=$?
          if [ "$ls_remote_status" -eq 2 ]; then
            echo "No $METRICS_BRANCH branch, nothing to sync."
            exit 0
          elif [ "$ls_remote_status" -ne 0 ]; then
            echo "::error::git ls-remote failed for $METRICS_BRANCH"
            exit "$ls_remote_status"
          fi
          # A merge needs the common ancestor, which the shallow checkout lacks. Blobs stay on the server
          # until the merge needs one.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --filter=blob:none --unshallow origin
          fi
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" \
            "+refs/heads/$METRICS_BRANCH:refs/remotes/origin/$METRICS_BRANCH"
          git switch --detach --force "refs/remotes/origin/$METRICS_BRANCH"
          if git merge-base --is-ancestor "refs/remotes/origin/$DEFAULT_BRANCH" HEAD; then
            echo "$METRICS_BRANCH already contains $DEFAULT_BRANCH."
            exit 0
          fi
          # The branch only ever edits the SVG and always holds the full history, so its SVG is the right one
          # even where the squash commit on the default branch edited different lines of the same file;
          # every other file merges as usual.
          git merge --no-commit --no-ff -X ours "refs/remotes/origin/$DEFAULT_BRANCH"
          git checkout "refs/remotes/origin/$METRICS_BRANCH" -- docs/assets/weekly-metrics.svg
          git commit -m "Merge $DEFAULT_BRANCH into $METRICS_BRANCH"
          # No force: a branch that moved since the fetch is rejected and fails the run.
          git push origin HEAD:"$METRICS_BRANCH"

      - name: 📬 Open the metrics pull request
        env:
          # A pull request opened with GITHUB_TOKEN triggers no checks; METRICS_PR_TOKEN does (see the header).
          GH_TOKEN: ${{ secrets.METRICS_PR_TOKEN || secrets.GITHUB_TOKEN }}
          METRICS_BRANCH: automation/update-weekly-metrics
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Runs on every scheduled and manual run, including those with no new data, so a branch whose pull
          # request was closed or never opened is picked up the next time the workflow runs.
          ls_remote_status=0
          git ls-remote --exit-code --heads origin "refs/heads/$METRICS_BRANCH" || ls_remote_status=$?
          if [ "$ls_remote_status" -eq 2 ]; then
            echo "No $METRICS_BRANCH branch, nothing to publish."
            exit 0
          elif [ "$ls_remote_status" -ne 0 ]; then
            echo "::error::git ls-remote failed for $METRICS_BRANCH"
            exit "$ls_remote_status"
          fi
          open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$METRICS_BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq length)"
          if [ "$open_count" -gt 0 ]; then
            echo "A pull request from $METRICS_BRANCH is already open."
            exit 0
          fi
          # After the sync step the three-dot diff is what a merge would publish, so a branch whose SVG already
          # matches the default branch opens no empty pull request.
          changed_files="$(gh api "repos/$GITHUB_REPOSITORY/compare/${DEFAULT_BRANCH}...${METRICS_BRANCH}" --jq '.files | length')"
          if [ "$changed_files" -eq 0 ]; then
            echo "$METRICS_BRANCH holds nothing the $DEFAULT_BRANCH branch lacks."
            exit 0
          fi
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${METRICS_BRANCH}?expand=1"
          body="Automated refresh of docs/assets/weekly-metrics.svg, opened by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$METRICS_BRANCH" --title "docs: update weekly project metrics" --body "$body")"; then
            echo "::notice title=Weekly metrics pull request::$pr_url"
            echo "Opened $pr_url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Weekly metrics pull request not opened::Add a METRICS_PR_TOKEN secret or allow Actions to create pull requests. Open it by hand: $compare_url"
            echo "Pull request not opened. Open it by hand: $compare_url" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
