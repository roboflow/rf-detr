name: Update Weekly Metrics SVG

# This workflow cannot open pull requests: the repository does not allow GitHub Actions to create
# them. It only keeps the automation/update-weekly-metrics branch current; a maintainer must open and
# merge a pull request from that branch into the default branch to publish
# docs/assets/weekly-metrics.svg. Every run that pushes prints the compare link for doing so.

on:
  schedule:
    # PyPI Stats starts its daily update around 01:00 UTC but publishes no completion SLA.
    # Monday 06:17 UTC leaves a buffer for Sunday data after the prior Mon–Sun week closes; the
    # off-hour minute avoids the top-of-hour peak, when GitHub delays or drops scheduled runs.
    # Tuesday through Thursday are retries: every run of the same calendar week resolves to the
    # same completed Mon–Sun period, and re-recording that period refreshes only its download
    # total, so a Monday lost to missing upstream data is recovered instead of skipped forever.
    - cron: "17 6 * * 1-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-metrics-svg
  cancel-in-progress: false

jobs:
  update-metrics:
    name: Update weekly metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 🐍 Install uv and set Python
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          version: "0.9.26"
          python-version: "3.10"
          activate-environment: true

      - name: 📚 Restore unmerged metrics history
        env:
          METRICS_BRANCH: automation/update-weekly-metrics
        run: |
          set -euo pipefail
          # Continue from the automation branch's own history whenever it exists, regardless of
          # whether it currently has an open pull request — a pull request can go stale or be closed
          # without the branch being deleted, and gating restoration on PR state would silently
          # discard every checkpoint already accumulated there.
          # An exact-ref lookup tells "branch absent" (exit 2) apart from a failed lookup, so a network
          # or auth error fails the run instead of silently restarting from the default branch's SVG.
          ls_remote_status=0
          git ls-remote --exit-code --heads origin "refs/heads/$METRICS_BRANCH" || ls_remote_status=$?
          if [ "$ls_remote_status" -eq 0 ]; then
            git fetch --no-tags --depth=1 origin "$METRICS_BRANCH" || {
              echo "::error::git fetch failed for $METRICS_BRANCH"
              exit 1
            }
            # The commit step anchors its push lease to the tip restored here.
            echo "METRICS_BASE_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            # The shell truncates a redirect target before the command on its left runs, so writing
            # straight onto the tracked path would leave an empty SVG behind whenever git show fails.
            git show FETCH_HEAD:docs/assets/weekly-metrics.svg > docs/assets/weekly-metrics.svg.tmp || {
              echo "::error::git show failed to restore weekly-metrics.svg from $METRICS_BRANCH"
              exit 1
            }
            mv docs/assets/weekly-metrics.svg.tmp docs/assets/weekly-metrics.svg
            # Stage the restored blob so the commit step's no-op guard compares the generator's output
            # with the branch's SVG, not the default branch's; otherwise every retry re-pushes it.
            git add -- docs/assets/weekly-metrics.svg
          elif [ "$ls_remote_status" -ne 2 ]; then
            echo "::error::git ls-remote failed for $METRICS_BRANCH"
            exit "$ls_remote_status"
          fi

      - name: 📊 Generate weekly metrics SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_weekly_metrics.py

      - name: 📤 Commit and push metrics update
        env:
          METRICS_BRANCH: automation/update-weekly-metrics
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/assets/weekly-metrics.svg; then
            echo "No changes to commit."
            exit 0
          fi
          git add -- docs/assets/weekly-metrics.svg
          git commit -m "docs: update weekly project metrics"
          # The lease expects the tip the restore step read the SVG from (METRICS_BASE_SHA, via GITHUB_ENV),
          # never a tip looked up now: a lease read at push time matches whatever the branch holds and so
          # degrades to an unconditional force that can drop a checkpoint. Unset means the branch was
          # absent at restore, and the empty expected value makes the push fail if it appeared since.
          git push --force-with-lease="refs/heads/$METRICS_BRANCH:${METRICS_BASE_SHA:-}" origin HEAD:"$METRICS_BRANCH"
          # Nothing here opens the pull request (see the header), so hand a maintainer the link to open one.
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${METRICS_BRANCH}?expand=1"
          echo "::notice title=Weekly metrics pushed::Open a PR to publish: $compare_url"
          echo "Weekly metrics pushed to \`$METRICS_BRANCH\`. Open a PR to publish: $compare_url" >> "$GITHUB_STEP_SUMMARY"
